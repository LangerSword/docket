[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.1.0"
description = "Experiment lifecycle control for self-hosted Flagsmith: audit the wiring, gate the release on statistics, ship the winner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
verdict = "verdict.cli:main"

[tool.setuptools]
packages = ["verdict"]

[tool.setuptools.package-data]
verdict = ["py.typed"]
